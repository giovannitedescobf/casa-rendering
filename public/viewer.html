  :root { --bg: #f4f5f7; --surface: #fff; --ink: #1c2330; --muted: #667085; --line: #dfe3ea; --line-soft: #e8ebf0; --line-strong: #c9ced8;

<script type="module">
import * as THREE from 'three';
import { t, applyI18n, locale } from '../i18n.mjs';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
applyI18n(); document.title = t('v.title');                       // fills the data-i18n texts / titles in the current language (public/i18n.mjs)
document.getElementById('morebtn').textContent = t('v.more') + ' ▾';

const view = document.getElementById('view');
const dot = document.getElementById('dot');
const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));  // phones report 3 or more: 2 looks the same and has less than half the pixels to shade
renderer.shadowMap.enabled = true;
renderer.shadowMap.autoUpdate = false;                  // shadow maps are redrawn only when something that casts or lights changed (shadowsDirty), not on every frame of an orbit
view.appendChild(renderer.domElement);
// The first build must not start on a GL context that is still coming up: with the scene already downloaded (early fetch
// in <head>) it began at once and every synchronous GL call (environment map, shader checks) stalled, 3.6 s to the first
// frame instead of 0.9 s in headless Chrome. So the first load waits for a GPU fence to signal and for 100 ms since the
// context was made (1.5 s at most); on a real network the scene arrives later than that anyway.
const glReady = new Promise(res => {
  const gl = renderer.getContext(), t0 = performance.now();
  let sync = null; try { sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush(); } catch (e) {}
  (function poll() {
    const age = performance.now() - t0; let s = null; try { s = sync && gl.clientWaitSync(sync, 0, 0); } catch (e) {}
    if (age > 1500 || (age >= 100 && (!sync || s === gl.ALREADY_SIGNALED || s === gl.CONDITION_SATISFIED || s === gl.WAIT_FAILED))) { try { if (sync) gl.deleteSync(sync); } catch (e) {} res(); }
    else setTimeout(poll, 10);

}

  for (const k of held) { const m = MOVE[k]; if (m && k !== 'e' && k !== 'q') { r += m[0]; f += m[1]; } }
  if (f || r) {
    const sp = dt * (held.has('shift') ? 240 : 80) / Math.hypot(f, r);   // inches per second (80" = 2 m/s)
    const dx = (Math.cos(fp.yaw) * f + Math.sin(fp.yaw) * r) * sp, dy = (Math.sin(fp.yaw) * f - Math.cos(fp.yaw) * r) * sp;

{ const cv = renderer.domElement;                      // click to start looking around (mouse captured), click again (or Esc) to stop

  };

  addEventListener('mousemove', e => {

// ---- keyboard fly: WASD / arrows move on the floor plane, Q/E down/up, Shift = faster ----
const MOVE = { w: [0, 1, 0], arrowup: [0, 1, 0], s: [0, -1, 0], arrowdown: [0, -1, 0],
               a: [-1, 0, 0], arrowleft: [-1, 0, 0], d: [1, 0, 0], arrowright: [1, 0, 0], e: [0, 0, 1], q: [0, 0, -1] };
const held = new Set();
let lastT = 0;
function stepMove(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  if (fp) { stepFP(dt); return; }
  if (!held.size) return;
  let r = 0, f = 0, u = 0;
  for (const k of held) { const m = MOVE[k]; if (!m) continue; r += m[0]; f += m[1]; u += m[2]; }   // 'shift' lives in `held` too
  const fwd = controls.target.clone().sub(camera.position); fwd.z = 0;
  if (fwd.lengthSq() < 1e-6) { fwd.set(0, 1, 0).applyQuaternion(camera.quaternion); fwd.z = 0; }   // looking straight down: use screen-up
  fwd.normalize();

addEventListener('keydown', e => {

addEventListener('keyup', e => {
  const k = e.key.toLowerCase();

addEventListener('blur', () => held.clear());
addEventListener('keydown', e => {

  if (e.key === 'k' || e.key === 'K') return document.getElementById('seldims').click();
  if (e.key === 'p' || e.key === 'P') return document.getElementById('snap').click();
  if (e.key === 'u' || e.key === 'U') return document.getElementById('unit').click();

if (!window.STATIC_BUILD) {                              // static version (no server): no automatic reload
  const es = new EventSource('events');
  let sseWasDown = false;                                  // after a reconnect (server restarted), fetch what changed meanwhile
  es.onopen = () => { dot.className = 'live'; if (sseWasDown) { sseWasDown = false; load(); } };
  es.onerror = () => { dot.className = ''; sseWasDown = true; };
  es.addEventListener('reload', () => {
    dot.className = 'flash'; setTimeout(() => dot.className = 'live', 400);
    load();
  });
}

// ---- PNG export: copies the canvas that is on screen (raster, AO or path tracer) right after it was drawn, so no buttons / labels / tooltip are included ----
let snapReq = false;

  const raster = !rtw.on && !rt.on;                                   // dimension lines are scene objects: hide them for the raster / AO image (path tracers don't draw them)

document.getElementById('snap').onclick = () => { snapReq = true; };

// Realistic look: with the camera under the ceiling (walking, or an orbit view from inside a room) the ceiling is drawn and the

function syncInside() {
  const cz = current?.ceiling?.z?.[0];
  const show = !!fp || (realLook && !rt.on && cz != null && (probing || camera.position.z < cz));
  insideNow = show;
  const cast = true;                                       // walls always shadow the sun: inside, daylight only enters through the openings (glass casts no shadow)
  if (ceilingMesh && ceilingMesh.visible !== show) { ceilingMesh.visible = show; invalidate(); }
  if (ceilingMesh) { const cc = realLook && show && !night && !rt.on; if (ceilingMesh.castShadow !== cc) { ceilingMesh.castShadow = cc; shadowsDirty(); } }   // the sun must not come through the roof
